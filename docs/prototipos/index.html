<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipos ISTEM</title>
<!-- Maqueta navegable de todos los módulos. DATOS FICTICIOS. Entregable 13 (prototipos de interfaz). -->
<style>/* ISTEM RESEARCH · sistema visual
   Corporativo y científico: azul profundo + turquesa, superficies limpias, profundidad suave. */
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --surface-3: #eef2f8;
  --text: #0c1830;
  --text-2: #33425c;
  --muted: #64748b;
  --line: #e3e8f0;
  --line-2: #d3dbe7;
  --brand: #1d4ed8;
  --brand-2: #0ea5a4;
  --brand-3: #6d5dfc;
  --brand-soft: #eaf0ff;
  --grad: linear-gradient(135deg, #1d4ed8 0%, #2563eb 40%, #0ea5a4 100%);
  --ok: #059669;   --ok-soft: #e6f7f0;
  --warn: #b45309; --warn-soft: #fff4e0;
  --bad: #dc2626;  --bad-soft: #fdecec;
  --info: #4f46e5; --info-soft: #eef0ff;
  --c-blue: #2563eb; --c-blue-soft: #e8efff;
  --c-teal: #0d9488; --c-teal-soft: #e2f6f3;
  --c-violet: #7c3aed; --c-violet-soft: #f1eaff;
  --c-amber: #d97706; --c-amber-soft: #fff3dc;
  --c-rose: #e11d48; --c-rose-soft: #ffe9ee;
  --side-bg: #0a1530;
  --side-bg-2: #0e1f45;
  --side-text: #c5d0e6;
  --side-muted: #7f8db0;
  --side-active: rgba(96, 165, 250, .16);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(12, 24, 48, .05);
  --shadow: 0 1px 2px rgba(12, 24, 48, .04), 0 8px 24px -6px rgba(12, 24, 48, .08);
  --shadow-lg: 0 20px 50px -12px rgba(12, 24, 48, .22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070d1c;
    --surface: #0e1729;
    --surface-2: #111c31;
    --surface-3: #16233c;
    --text: #e8eefa;
    --text-2: #c2cde2;
    --muted: #8b9ab6;
    --line: #1d2a44;
    --line-2: #283a5c;
    --brand: #60a5fa;
    --brand-2: #2dd4bf;
    --brand-3: #a78bfa;
    --brand-soft: #12244a;
    --ok: #34d399;   --ok-soft: #0c2a22;
    --warn: #fbbf24; --warn-soft: #2b2110;
    --bad: #f87171;  --bad-soft: #321417;
    --info: #a5b4fc; --info-soft: #1a1d40;
    --c-blue: #60a5fa; --c-blue-soft: #132650;
    --c-teal: #2dd4bf; --c-teal-soft: #0c2c2c;
    --c-violet: #a78bfa; --c-violet-soft: #23183f;
    --c-amber: #fbbf24; --c-amber-soft: #2c2310;
    --c-rose: #fb7185; --c-rose-soft: #331520;
    --side-bg: #050a16;
    --side-bg-2: #0a1430;
    --shadow: 0 1px 0 rgba(255, 255, 255, .02) inset, 0 10px 30px -10px rgba(0, 0, 0, .6);
    --shadow-lg: 0 24px 60px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -.02em; margin: 0 0 .5rem; color: var(--text); }
h1 { font-size: 1.75rem; font-weight: 750; }
h2 { font-size: 1.08rem; font-weight: 700; }
h3 { font-size: .98rem; font-weight: 700; }
p { margin: 0 0 .75rem; }
code, .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace; font-size: .84em; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::selection { background: color-mix(in srgb, var(--brand) 25%, transparent); }

/* ---------- Marca ---------- */
.brand { display: flex; align-items: center; gap: .7rem; font-weight: 800; letter-spacing: .04em; color: var(--text); font-size: .95rem; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: var(--grad); box-shadow: 0 6px 18px -4px rgba(37, 99, 235, .55), inset 0 1px 0 rgba(255,255,255,.25); flex: none; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: .7rem; letter-spacing: .02em; margin-top: 1px; }
.sidebar .brand { color: #fff; }
.sidebar .brand small { color: var(--side-muted); }

/* ---------- Estructura del portal ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  background: radial-gradient(120% 60% at 0% 0%, rgba(37, 99, 235, .28), transparent 60%),
              radial-gradient(90% 50% at 100% 100%, rgba(14, 165, 164, .18), transparent 60%),
              linear-gradient(180deg, var(--side-bg-2), var(--side-bg));
  color: var(--side-text);
  padding: 1.1rem .85rem 1rem;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 1rem;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
}
.sidebar .brand { padding: .2rem .45rem .4rem; }
.nav-group { margin-bottom: .55rem; }
.nav-group-title { font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--side-muted); padding: .35rem .7rem .3rem; font-weight: 700; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: .7rem; padding: .48rem .7rem; border-radius: 10px; color: var(--side-text); font-size: .885rem; position: relative; transition: background .15s, color .15s; }
.nav a svg { color: var(--side-muted); transition: color .15s; flex: none; }
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; text-decoration: none; }
.nav a:hover svg { color: #fff; }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; font-weight: 650; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -.85rem; top: 22%; bottom: 22%; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(#60a5fa, #2dd4bf); }
.nav a[aria-current="page"] svg { color: #7cc4ff; }
.nav .label { flex: 1; min-width: 0; }
.nav .phase { font-size: .62rem; color: var(--side-muted); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px; padding: 0 .45rem; white-space: nowrap; font-weight: 600; }
.nav .phase.partial { color: #7dd3c0; border-color: rgba(45, 212, 191, .35); }
.side-foot { margin-top: auto; padding: .85rem; border-radius: 14px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); font-size: .78rem; color: var(--side-muted); }
.side-foot strong { color: #fff; display: block; font-size: .82rem; margin-bottom: .2rem; }
.side-foot .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); margin-top: .6rem; overflow: hidden; }
.side-foot .bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #60a5fa, #2dd4bf); }

.nav-mobile { display: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .7rem 1.75rem; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  position: sticky; top: 0; z-index: 15; flex-wrap: wrap;
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.org-switch { display: flex; align-items: center; gap: .55rem; padding: .25rem .3rem .25rem .6rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); }
.org-switch .org-dot { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--c-violet), var(--c-blue)); }
.org-switch select { border: 0; background: transparent; padding: .3rem 1.4rem .3rem .1rem; font-weight: 650; font-size: .88rem; max-width: 260px; cursor: pointer; }
.org-switch select:focus { outline: none; }
.user-chip { display: flex; align-items: center; gap: .55rem; font-size: .84rem; color: var(--text-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: .8rem; color: #fff; background: linear-gradient(135deg, #0ea5a4, #2563eb); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
.user-chip .who { display: grid; line-height: 1.2; }
.user-chip .who small { color: var(--muted); font-size: .72rem; }
.content { padding: 1.75rem; max-width: 1240px; width: 100%; }

@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .nav-mobile { display: block; position: relative; }
  .nav-mobile summary { cursor: pointer; display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; list-style: none; background: var(--surface); }
  .nav-mobile summary::-webkit-details-marker { display: none; }
  .nav-mobile[open] .mobile-panel { position: fixed; left: 16px; right: 16px; top: 64px; background: linear-gradient(180deg, var(--side-bg-2), var(--side-bg)); border-radius: var(--radius); padding: .75rem; z-index: 30; box-shadow: var(--shadow-lg); max-height: calc(100vh - 90px); overflow: auto; }
  .topbar { padding: .65rem 16px; }
  .content { padding: 1.1rem 16px 2rem; }
  .user-chip .who { display: none; }
  .topbar-right .btn span { display: none; }
  .org-switch select { max-width: 170px; }
  .pitem { grid-template-columns: auto minmax(0, 1fr); }
  .pitem > .badge { grid-column: 2; justify-self: start; }
  .p-meta { flex-wrap: wrap; }
  .hero-band { padding: 1.4rem 1.25rem; }
}

/* ---------- Encabezados ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin: .15rem 0 0; max-width: 72ch; }
.eyebrow { display: inline-flex; align-items: center; gap: .4rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .14em; color: var(--brand-2); font-weight: 750; margin-bottom: .4rem; }

.hero-band {
  position: relative; overflow: hidden; border-radius: 22px; padding: 1.8rem 2rem; margin-bottom: 1.5rem; color: #fff;
  background:
    radial-gradient(60% 120% at 100% 0%, rgba(45, 212, 191, .55), transparent 60%),
    radial-gradient(50% 90% at 0% 100%, rgba(124, 58, 237, .45), transparent 60%),
    linear-gradient(120deg, #0b1f4d, #1d4ed8 60%, #0f766e);
  box-shadow: var(--shadow-lg);
}
.hero-band::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px); background-size: 18px 18px; mask-image: linear-gradient(90deg, transparent 30%, #000); pointer-events: none; }
.hero-band > * { position: relative; z-index: 1; }
.hero-band h1 { color: #fff; font-size: clamp(1.5rem, 3vw, 2.1rem); margin-bottom: .35rem; }
.hero-band p { color: rgba(255, 255, 255, .82); max-width: 60ch; margin: 0; }
.hero-band .eyebrow { color: #99f6e4; }
.hero-band .hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.25rem; flex-wrap: wrap; }
.hero-band .btn { border-color: rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; backdrop-filter: blur(6px); }
.hero-band .btn:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.5); }
.hero-band .btn.primary { background: #fff; color: #0b1f4d; border-color: #fff; box-shadow: 0 8px 24px -8px rgba(0,0,0,.5); }
.hero-chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
.hero-chips span { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; padding: .25rem .65rem; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); }

/* ---------- Tarjetas ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem 1.35rem; box-shadow: var(--shadow); }
:not(.grid) > .card + .card { margin-top: 1.1rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.card-head h2 { margin: 0; display: flex; align-items: center; gap: .55rem; }
.card-head p { margin: 0; color: var(--muted); font-size: .84rem; }
.card-title-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.grid { display: grid; gap: 1.1rem; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.wide-left { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.wide-left { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 1.1rem; }

/* KPI */
.kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.15rem 1rem; box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.kpi::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--tone-soft); opacity: .7; }
.kpi > * { position: relative; z-index: 1; }
.kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.kpi-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--tone); background: var(--tone-soft); }
.kpi .label { color: var(--muted); font-size: .8rem; font-weight: 600; }
.kpi .value { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .note { color: var(--muted); font-size: .74rem; margin-top: .25rem; }
.kpi.unavailable { background: repeating-linear-gradient(135deg, var(--surface) 0 10px, var(--surface-2) 10px 20px); box-shadow: none; border-style: dashed; border-color: var(--line-2); }
.kpi.unavailable:hover { transform: none; box-shadow: none; }
.kpi.unavailable::after { display: none; }
.kpi.unavailable .value { font-size: .95rem; font-weight: 650; color: var(--muted); padding: .35rem 0 .1rem; }
.kpi.unavailable .kpi-icon { background: var(--surface-3); color: var(--muted); }
.tone-blue { --tone: var(--c-blue); --tone-soft: var(--c-blue-soft); }
.tone-teal { --tone: var(--c-teal); --tone-soft: var(--c-teal-soft); }
.tone-violet { --tone: var(--c-violet); --tone-soft: var(--c-violet-soft); }
.tone-amber { --tone: var(--c-amber); --tone-soft: var(--c-amber-soft); }
.tone-rose { --tone: var(--c-rose); --tone-soft: var(--c-rose-soft); }
.section-label { display: flex; align-items: center; gap: .6rem; margin: 1.6rem 0 .8rem; font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .13em; color: var(--muted); }
.section-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* ---------- Insignias ---------- */
.badge { display: inline-flex; align-items: center; gap: .38rem; padding: .16rem .62rem; border-radius: 999px; font-size: .73rem; font-weight: 650; border: 1px solid transparent; white-space: nowrap; line-height: 1.5; }
.badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.neutral { background: var(--surface-3); color: var(--text-2); }
.badge.brand { background: var(--brand-soft); color: var(--brand); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.violet { background: var(--c-violet-soft); color: var(--c-violet); }
.badge.teal { background: var(--c-teal-soft); color: var(--c-teal); }
a.badge:hover { text-decoration: none; filter: brightness(.97); }

/* ---------- Avisos ---------- */
.alert { border-radius: 12px; padding: .75rem .95rem .75rem 2.6rem; border: 1px solid; font-size: .88rem; margin: .6rem 0; position: relative; color: var(--text-2); }
.alert::before { content: ""; position: absolute; left: .95rem; top: .95rem; width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 20%, transparent); }
.alert strong { display: block; margin-bottom: .1rem; color: var(--text); }
.alert.bloqueo, .alert.error { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
.alert.bloqueo::before, .alert.error::before { background: var(--bad); }
.alert.advertencia { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.alert.advertencia::before { background: var(--warn); }
.alert.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 22%, transparent); }
.alert.info::before { background: var(--info); }
.alert.success { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.alert.success::before { background: var(--ok); }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .55rem 1rem; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-weight: 650; cursor: pointer; font-size: .88rem; transition: transform .12s, box-shadow .15s, border-color .15s, background .15s; box-shadow: var(--shadow-sm); white-space: nowrap; }
.btn:hover { border-color: var(--brand); text-decoration: none; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px rgba(37, 99, 235, .7); }
.btn.primary:hover { box-shadow: 0 12px 26px -8px rgba(37, 99, 235, .8); filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); background: var(--bad-soft); }
.btn.small { padding: .32rem .7rem; font-size: .79rem; border-radius: 9px; }
.btn.link { border: 0; background: none; color: var(--brand); padding: 0; box-shadow: none; }
.btn.link:hover { transform: none; text-decoration: underline; }
.btn.ghost { background: transparent; box-shadow: none; }

/* ---------- Formularios ---------- */
.form { display: grid; gap: 1rem; }
.form-row { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
.field { display: grid; gap: .35rem; }
.field label, .field legend { font-weight: 650; font-size: .84rem; color: var(--text-2); }
.field .hint { color: var(--muted); font-size: .77rem; }
.field .error { color: var(--bad); font-size: .78rem; font-weight: 600; }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: .6rem .75rem; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line-2)); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 16%, transparent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--brand); width: 16px; height: 16px; margin-top: .15rem; }
textarea { min-height: 96px; resize: vertical; }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem 1rem; margin: 0; background: var(--surface-2); }
fieldset legend { padding: 0 .4rem; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .45rem .9rem; }
.checks label { display: flex; gap: .5rem; align-items: flex-start; font-size: .86rem; font-weight: 500; padding: .35rem .5rem; border-radius: 8px; cursor: pointer; color: var(--text); }
.checks label:hover { background: var(--surface); }
.checks label:has(input:checked) { background: var(--brand-soft); color: var(--brand); font-weight: 600; }

  const px = (x) => 40 + (x / (labels.length - 1)) * (w - 60);
  const py = (y) => h - 28 - ((y - yMin) / (yMax - yMin)) * (h - 50);
  let svg = `<svg viewBox="0 0 ${w} ${h}" class="chart" role="img">`;
  for (let t = yMin; t <= yMax; t += (yMax - yMin) / 4) svg += `<line x1="40" x2="${w - 20}" y1="${py(t)}" y2="${py(t)}" class="grid"/><text x="32" y="${py(t) + 4}" class="axis" text-anchor="end">${Math.round(t)}%</text>`;
  labels.forEach((l, i) => { if (i % 2 === 0) svg += `<text x="${px(i)}" y="${h - 8}" class="axis" text-anchor="middle">${l}</text>`; });
  if (band) svg += `<path d="${band.hi.map((y, i) => `${i ? "L" : "M"}${px(i)},${py(y)}`).join("")}${band.lo.map((y, i) => `L${px(band.lo.length - 1 - i)},${py(band.lo[band.lo.length - 1 - i])}`).join("")}Z" fill="${band.color}" opacity=".15"/>`;
  series.forEach((s) => {
    if (s.points) s.points.forEach(([x, y]) => (svg += `<circle cx="${px(x)}" cy="${py(y)}" r="4" fill="${s.color}" opacity=".85"/>`));
    if (s.line) svg += `<path d="${s.line.map((y, i) => `${i ? "L" : "M"}${px(i)},${py(y)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linecap="round" stroke-linejoin="round" ${s.dash ? 'stroke-dasharray="5 5"' : ""}/>`;
  });
  return svg + "</svg>";
}
